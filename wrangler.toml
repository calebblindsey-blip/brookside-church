# Cloudflare Pages project config.
#
# The PAGES are a pure static build: 9 HTML files plus fingerprinted assets, no
# server rendering and no adapter. Astro's default static output is already
# exactly what Pages wants, which is why `astro.config.mjs` has no `adapter` and
# no `output` line and should not grow one.
#
# There is now exactly ONE Function, `functions/api/live.js`, answering
# `/api/live`. It is deliberately NOT an Astro adapter: an adapter would make
# all 9 pages server-rendered and end the property this file exists to protect.
# `public/_routes.json` confines the Worker to `/api/*`, so every page is still
# a static file served straight off the edge. Check that file before adding a
# second Function; without an `include` entry a new route silently 404s.
#
# It needs one secret, set once at the project level (it survives deploys):
#   npx wrangler pages secret put YOUTUBE_API_KEY --project-name brookside-church
# Locally the same value comes from `.dev.vars`, which is gitignored.
#
# `pages_build_output_dir` is what makes `wrangler pages deploy` work with no
# arguments and no dashboard configuration, so the deploy command is the same
# from a laptop as it is from CI.
#
# Direct upload, not the Git integration. The Git integration builds on
# Cloudflare's runners, which means the live site depends on their Node version
# and a successful `npm ci` at deploy time; direct upload sends the dist/ that
# was just built and verified locally. Switching to the Git integration later is
# a dashboard setting and does not change this file.

name = "brookside-church"
pages_build_output_dir = "dist"

# Consulted by the Function above. Pinned so it cannot silently inherit
# whatever the platform default was the week of a given deploy.
compatibility_date = "2026-07-27"
