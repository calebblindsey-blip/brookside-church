<!--
  Favicon: the church's mark, from the official brand package (adopted 2026-07-29).
  Source: branding/brookside-church/assets/Brookside-Brand-Package/02-Final-Logos/
  in Compass. Paths copied verbatim from brookside-mark-primary.svg, which since
  2026-09-05 is the DM Sans 550 redraw written by the Compass branding tooling
  (redraw-mark.py). Same construction, heavier letter.

  WHY THE WHOLE MARK NOW, AND NOT A CROSS ON ITS OWN. The mark this replaces was
  a filled letterform with the cross fused into it. At 16px it collapsed into an
  unreadable blob, and on a dark tab strip its near-black bowls vanished and left
  a coral cross with a hole in it. So the favicon had to be a different drawing
  from the logo: two shapes sharing a colour and nothing else.

  This mark does not need that. The B is drawn as STROKES, so the cross sits in
  real counter-space rather than fighting the letter for the same pixels, and the
  pair survives the scale down. The favicon is now literally the logo.

  The B is set in the brand grey rather than currentColor: an SVG favicon has no
  inherited text colour to take, and #B8BAB8 reads on both a light and a dark tab
  strip. A near-black B would disappear on dark, which is the exact failure that
  forced the previous favicon to be a separate drawing.
-->
