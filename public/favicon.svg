<!--
  Favicon: the church's mark, from the official brand package. Paths copied
  verbatim from brookside-mark-digital.svg in Compass
  (branding/brookside-church/assets/Brookside-Brand-Package/02-Final-Logos/),
  which redraw-mark.py writes. Never hand-edit a path here; change the script.

  WHY THE WHOLE MARK, AND NOT A CROSS ON ITS OWN. The mark this replaced was a
  filled letterform with the cross fused into it. At 16px it collapsed into an
  unreadable blob. This B is drawn as STROKES, so the cross sits in real
  counter-space rather than fighting the letter for the same pixels, and the
  pair survives the scale down. The favicon is literally the logo.

  WHY IT IS THEME AWARE, AND NOT ONE FLAT COLOUR. A favicon is a graphic, so it
  has to clear 3.0:1 against every ground it can land on, and browser tab strips
  are light or dark depending on the viewer. Measured against the four real
  grounds (light strip #dee1e6, light active #ffffff, dark strip #202124, dark
  active #35363a), NO single colour in the brand palette clears 3.0 on all four:

    ink    #183c55   8.82 / 11.56 ok   ...   1.39 / 1.04 invisible on dark
    copper #ac432b   4.46 /  5.85 ok   ...   2.75 / 2.06 low on dark
    bone   #fcfcf9   1.28 /  1.03 invisible on light   ...   15.66 / 11.74 ok

  The favicon this replaced was the package grey #B8BAB8, chosen on the belief
  that it "reads on both a light and a dark tab strip". It does not: it measures
  1.49:1 on a light tab strip, so the letter has been effectively invisible
  there, leaving a lone cross. Swapping it for a flat ink B would only have moved
  the problem to dark tabs, where ink is 1.04:1.

  So each scheme gets the pair that works on it. #d1a993 is the copper tint the
  site already uses; it is not a new colour, and it measures 7.52 / 5.64 on dark.

    light   letter ink    #183c55    cross copper      #ac432b
    dark    letter bone   #fcfcf9    cross copper tint #d1a993

  The raster fallbacks (favicon.ico, apple-touch-icon.png) cannot carry a media
  query and are rendered from the LIGHT branch, which is correct for the
  touch icon (it sits on a bone tile) and is the right compromise for the .ico,
  which only reaches browsers too old to accept this SVG at all.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Brookside Church of God">
  <style>
    .letter { fill: #183c55; }
    .cross  { fill: #ac432b; }
    @media (prefers-color-scheme: dark) {
      .letter { fill: #fcfcf9; }
      .cross  { fill: #d1a993; }
    }
  </style>
  <path class="letter" d="M116 135.51V68H255.18Q293.45 68 319.13 80.1Q344.81 92.2 357.79 113.31Q370.78 134.43 370.78 161.44Q370.78 189.28 358.68 208.05Q346.58 226.83 326.95 236.81Q317.29 241.72 306.93 244.69Q322.8 247.61 336.46 256.1Q356.12 268.33 367.62 288.59Q379.12 308.85 379.12 333.41Q379.12 361.82 365.33 384.43Q351.54 407.03 324.97 420.02Q298.41 433 259.82 433H181.36V385.9H251.85Q284.51 385.9 302.61 370.62Q320.72 355.33 320.72 327.63Q320.72 300.14 302.09 283.96Q283.47 267.79 250.81 267.79H247.84V223.82Q279.25 223.82 295.73 209.24Q312.22 194.65 312.22 168.94Q312.22 143.95 295.73 129.29Q279.25 114.63 246.75 114.63H173.36V135.51Z"/>
  <path class="cross" d="M116 143.51H173.36V223.82H239.84V267.79H173.36V433H116V267.79H49.46V223.82H116Z"/>
</svg>
