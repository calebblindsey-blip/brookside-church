<!--
  Favicon. NOT a downscale of BrooksideMark.astro, deliberately.

  The full mark is a B whose stem is a cross and whose top stroke is the
  crossbar's right arm. That interlock is the idea, and it is legible at header
  size and above. Below roughly 22px the two bowls and the waist notch collapse
  into one another and the silhouette reads as a currency symbol rather than a
  letter, which is the opposite of what a mark is for in a tab strip.

  So the favicon takes the half of the mark that survives: the cross, given back
  the right arm the letter borrows from it. The proportions are the mark's, not
  a generic crucifix. Arm-to-stem ratio 1.25 against the mark's 1.3, and the bar
  sits at 0.35 of the height rather than the mark's 0.31, that small correction
  being what keeps the upper stem from closing up at 16px.

  Coral on transparent. Transparent so it sits correctly in both light and dark
  browser chrome, coral because that is the colour doing this exact job
  everywhere else on the site: the line that becomes a cross.

  Grid 32x32. Stroke 6. Stem x13-19, y2-30. Bar x5.5-26.5, y8.7-14.7.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
    <path fill="#FF5757" d="M13 2h6v6.7h7.5v6H19V30h-6V14.7H5.5v-6H13z" />
</svg>
