<!--
  Favicon: the mark's own cross, scaled to fill.

  The mark this replaces fused the cross into the letter, so its cross had no
  right arm and the favicon had to invent one back, which is why the site ended
  up shipping two shapes that shared a colour and nothing else. The mark now
  carries a whole latin cross, so this is simply that cross on its own.

  It is a straight scale-up, not a redraw. Same stroke-to-height ratio (17.4%
  here against the mark's 17.2%), same bar at 30% of the height, same arms at
  1.5x the stroke. Nothing was re-proportioned for small sizes because nothing
  needed to be: at the mark's working weight the stroke lands near 3px at 16px,
  which holds in a tab strip on its own.

  Coral on transparent. Transparent so it sits correctly in both light and dark
  browser chrome, coral because that is the colour doing this exact job
  everywhere else on the site: the line that becomes a cross.

  Generated with the mark by assets/proposed/tooling/emit_all.py in Compass.
  Grid 48. Stroke 8.375. Stem x19.812-28.188, y2-46. Bar x7.249-40.751.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
    <path fill="#FF5757" d="M19.812 2H28.188V15.2H40.751V23.575H28.188V46H19.812V23.575H7.249V15.2H19.812Z" />
</svg>
